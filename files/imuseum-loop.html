<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Loop Video PWA</title>

  <!-- iOS PWA meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link id="manifest-link" rel="manifest" href="#">

  <style>
    html,body { height:100%; margin:0; background:#000; }
    video { width:100%; height:100%; object-fit:cover; display:block; }
  </style>
</head>
<body>
  <video id="bgvideo" playsinline muted autoplay loop preload="auto">
    <source src="https://jbluebird.github.io/h/files/1174935980777693185.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <script>
    // Minimal PWA manifest
    const manifestData = {
      name: 'Loop Video PWA',
      short_name: 'LoopVid',
      start_url: '.',
      display: 'standalone',
      background_color: '#000000',
      theme_color: '#000000',
      icons: [
        {src: '/apple-touch-icon.png', sizes: '180x180', type: 'image/png'}
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestData)], {type:'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    document.getElementById('manifest-link').href = manifestURL;

    // Minimal service worker for offline start
    if('serviceWorker' in navigator){
      const swSource = `
        self.addEventListener('install', e=>self.skipWaiting());
        self.addEventListener('activate', e=>self.clients.claim());
      `;
      const swBlob = new Blob([swSource], {type:'application/javascript'});
      const swURL = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swURL);
    }
  </script>
</body>
</html>
